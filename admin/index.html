<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员上传 - 教学成果材料展示</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/admin.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="content-wrapper header-bar">
        <a class="brand" href="/">教学成果材料展示</a>
        <nav class="nav-links">
          <a href="/">首页</a>
          <a href="/categories/student-cultivation.html">学生培养</a>
          <a href="/categories/teacher-achievements.html">教师成果</a>
          <a href="/categories/domestic-impact.html">国内影响力</a>
          <a href="/categories/international-impact.html">国际影响力</a>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <div class="content-wrapper">
        <section class="section">
          <h1>管理员上传</h1>
          <div class="admin-panel">
            <div class="alert">
              <p>说明：该页面支持上传材料并通过 GitHub API 更新 `assets/data/materials.json`。若使用外部存储，请填写存储上传接口地址。</p>
            </div>
            <form id="upload-form">
              <label for="github-token">GitHub Token</label>
              <input id="github-token" type="password" placeholder="输入 GitHub Personal Access Token" required>

              <label for="storage-endpoint">外部存储上传接口（可选）</label>
              <input id="storage-endpoint" type="url" placeholder="https://example.com/upload">

              <label for="material-id">材料 ID（可选，留空则自动生成）</label>
              <input id="material-id" type="text" placeholder="material-2026-001">

              <label for="category">一级分类</label>
              <select id="category" required>
                <option value="">请选择分类</option>
                <option>学生培养</option>
                <option>教师成果</option>
                <option>国内影响力</option>
                <option>国际影响力</option>
              </select>

              <label for="subcategory">二级分类</label>
              <input id="subcategory" type="text" placeholder="例如：学生优秀论文" required>

              <label for="title">材料标题</label>
              <input id="title" type="text" required>

              <label for="description">材料简介</label>
              <textarea id="description"></textarea>

              <label for="date">时间</label>
              <input id="date" type="date" required>

              <label for="type">材料类型</label>
              <input id="type" type="text" placeholder="例如：论文/证书/项目证明" required>

              <label for="tags">标签（多个标签用逗号分隔）</label>
              <input id="tags" type="text" placeholder="AI, 教育, 论文">

              <label for="cover-file">封面图片</label>
              <input id="cover-file" type="file" accept="image/*">

              <label for="attachment-files">附件文件（Word/PDF 等，可多选）</label>
              <input id="attachment-files" type="file" multiple>

              <input type="submit" value="上传并保存">
            </form>
            <p id="admin-status" class="alert" style="margin-top:16px;color:#065f46;">请填写表单并提交。</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="content-wrapper">
        <p>© 2026 教学成果奖材料展示平台</p>
      </div>
    </footer>
  </body>
</html>
