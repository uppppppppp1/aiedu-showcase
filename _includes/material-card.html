<article class="material-card">
  <div class="card-image">
    <img src="{{ material.cover }}" alt="{{ material.title }} 封面" loading="lazy">
  </div>
  <div class="card-body">
    <span class="tag">{{ material.category }} / {{ material.subcategory }}</span>
    <h3>{{ material.title }}</h3>
    <p>{{ material.description }}</p>
    <div class="card-meta">
      <span>{{ material.date }}</span>
      <span>{{ material.type }}</span>
    </div>
    <div class="card-actions">
      <a class="button small" href="{{ material.id }}.html" onclick="return false;" data-material-id="{{ material.id }}">查看详情</a>
    </div>
  </div>
</article>
