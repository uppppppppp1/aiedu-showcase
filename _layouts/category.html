---
layout: default
---

<div class="page-wrapper">
  <section class="page-header">
    <div class="content-wrapper">
      <h1>{{ page.title }}</h1>
      {% if page.subcategoryList and page.subcategoryList.size > 0 %}
      <p>子分类：{{ page.subcategoryList | join: ' / ' }}</p>
      {% endif %}
    </div>
  </section>
  {{ content }}
</div>
